# Documentation: https://wiki.unvanquished.net/wiki/Continuous_integration

trigger:
  branches:
    include:
      - master

pr:
  branches:
    include:
      - '*'
  paths:
    include:
      - .azure-pipelines.yml
      # The rest of this list should stay in sync with .appveyor.yml
      - crunch/
      - crnlib/
      - inc/
      - example1/
      - example2/
      - example3/
      - test/
      - cmake/
      - CMakeLists.txt

strategy:
  matrix:
    Linux amd64 GCC:
      VM_IMAGE: 'ubuntu-22.04'
      APT_PACKAGES: ninja-build g++-10
      C_COMPILER: gcc-10
      CXX_COMPILER: g++-10
    Linux i686 GCC:
      VM_IMAGE: 'ubuntu-22.04'
      APT_PACKAGES: ninja-build g++-i686-linux-gnu
      C_COMPILER: i686-linux-gnu-gcc
      CXX_COMPILER: i686-linux-gnu-g++
      COMPILER_FLAGS: -mfpmath=sse -msse
    Linux arm64 GCC:
      VM_IMAGE: 'ubuntu-26.04'
      APT_PACKAGES: ninja-build g++-aarch64-linux-gnu qemu-user
      C_COMPILER: aarch64-linux-gnu-gcc
      CXX_COMPILER: aarch64-linux-gnu-g++
      CRUNCH_EXE_RUNNER: qemu-aarch64 -L /usr/aarch64-linux-gnu
    Linux armhf GCC:
      VM_IMAGE: 'ubuntu-26.04'
      APT_PACKAGES: ninja-build g++-arm-linux-gnueabihf qemu-user
      C_COMPILER: arm-linux-gnueabihf-gcc
      CXX_COMPILER: arm-linux-gnueabihf-g++
      CRUNCH_EXE_RUNNER: qemu-arm -L /usr/arm-linux-gnueabihf
    Linux ppc64 GCC:
      VM_IMAGE: 'ubuntu-26.04'
      APT_PACKAGES: ninja-build g++-powerpc64-linux-gnu qemu-user
      C_COMPILER: powerpc64-linux-gnu-gcc
      CXX_COMPILER: powerpc64-linux-gnu-g++
      CRUNCH_EXE_RUNNER: qemu-ppc64 -L /usr/powerpc64-linux-gnu
    Linux ppc64el GCC:
      VM_IMAGE: 'ubuntu-26.04'
      APT_PACKAGES: ninja-build g++-powerpc64le-linux-gnu qemu-user
      C_COMPILER: powerpc64le-linux-gnu-gcc
      CXX_COMPILER: powerpc64le-linux-gnu-g++
      CRUNCH_EXE_RUNNER: qemu-ppc64le -L /usr/powerpc64le-linux-gnu
    Linux riscv64 GCC:
      VM_IMAGE: 'ubuntu-26.04'
      APT_PACKAGES: ninja-build g++-riscv64-linux-gnu qemu-user
      C_COMPILER: riscv64-linux-gnu-gcc
      CXX_COMPILER: riscv64-linux-gnu-g++
      CRUNCH_EXE_RUNNER: qemu-riscv64 -L /usr/riscv64-linux-gnu
    Linux loong64 GCC:
      VM_IMAGE: 'ubuntu-26.04'
      APT_PACKAGES: ninja-build g++-loongarch64-linux-gnu qemu-user
      C_COMPILER: loongarch64-linux-gnu-gcc
      CXX_COMPILER: loongarch64-linux-gnu-g++
      CRUNCH_EXE_RUNNER: qemu-loongarch64 -L /usr/loongarch64-linux-gnu
    Linux s390x GCC:
      VM_IMAGE: 'ubuntu-26.04'
      APT_PACKAGES: ninja-build g++-s390x-linux-gnu qemu-user
      C_COMPILER: s390x-linux-gnu-gcc
      CXX_COMPILER: s390x-linux-gnu-g++
      CRUNCH_EXE_RUNNER: qemu-s390x -L /usr/s390x-linux-gnu
    Linux amd64 Clang:
      VM_IMAGE: 'ubuntu-22.04'
      APT_PACKAGES: ninja-build
      C_COMPILER: clang
      CXX_COMPILER: clang++
    Windows amd64 MinGW:
      VM_IMAGE: 'ubuntu-26.04'
      APT_PACKAGES: ninja-build g++-mingw-w64-x86-64 mingw-w64-x86-64-dev gcc-mingw-w64-x86-64-posix-runtime wine64
      SETUP_COMMANDS: sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
      TOOLCHAIN_FILE: cmake/cross-toolchain-mingw64.cmake
      RUNTIME_FILES: /usr/lib/gcc/x86_64-w64-mingw32/13-posix/libgcc_s_seh-1.dll /usr/lib/gcc/x86_64-w64-mingw32/13-posix/libstdc++-6.dll /usr/x86_64-w64-mingw32/lib/libwinpthread-1.dll
      CRUNCH_EXE_RUNNER: wine
      CRUNCH_EXE_EXTENSION: .exe
    Windows i686 MinGW:
      VM_IMAGE: 'ubuntu-26.04'
      APT_ARCHITECTURE: i386
      APT_PACKAGES: ninja-build g++-mingw-w64-i686 mingw-w64-i686-dev gcc-mingw-w64-i686-posix-runtime wine64
      SETUP_COMMANDS: sudo update-alternatives --set i686-w64-mingw32-g++ /usr/bin/i686-w64-mingw32-g++-posix
      TOOLCHAIN_FILE: cmake/cross-toolchain-mingw32.cmake
      COMPILER_FLAGS: -mfpmath=sse -msse
      RUNTIME_FILES: /usr/lib/gcc/i686-w64-mingw32/13-posix/libgcc_s_dw2-1.dll /usr/lib/gcc/i686-w64-mingw32/13-posix/libstdc++-6.dll /usr/i686-w64-mingw32/lib/libwinpthread-1.dll
      CRUNCH_EXE_RUNNER: wine
      CRUNCH_EXE_EXTENSION: .exe
    Windows arm64 MinGW:
      VM_IMAGE: 'windows-2025'
      PACMAN_PACKAGES: mingw-w64-cross-mingwarm64-gcc
      C_COMPILER: aarch64-w64-mingw32-gcc
      CXX_COMPILER: aarch64-w64-mingw32-g++
      CRUNCH_EXE_EXTENSION: .exe
      RUN_TESTS: false
    macOS amd64 AppleClang:
      VM_IMAGE: 'macOS-14'
      PIP_PACKAGES: colorama
      CMAKE_GENERATOR: Unix Makefiles
      NPROC_COMMAND: sysctl -n hw.logicalcpu
    macOS arm64 AppleClang:
      VM_IMAGE: 'macOS-14'
      PIP_PACKAGES: colorama
      CMAKE_GENERATOR: Unix Makefiles
      COMPILER_FLAGS: -target arm64-apple-macos11 -Wno-overriding-t-option
      NPROC_COMMAND: sysctl -n hw.logicalcpu
      RUN_TESTS: false
    Web Asm.js Emscripten:
      VM_IMAGE: 'ubuntu-22.04'
      APT_PACKAGES: ninja-build emscripten
      TOOLCHAIN_FILE: /usr/share/emscripten/cmake/Modules/Platform/Emscripten.cmake
      SOURCE_DIR: emscripten
      EXECUTABLES: crunch.js crunch.wasm
      RUN_TESTS: false

pool:
  vmImage: $(VM_IMAGE)

steps:
- bash: |
    set -xue
    if [ -n "${APT_ARCHITECTURE:-}" ]; then
      sudo dpkg --add-architecture "${APT_ARCHITECTURE}"
    fi
    if [ -n "${APT_PACKAGES:-}" ]; then
      sudo apt-get update && sudo apt-get -y -q --no-install-recommends install ${APT_PACKAGES}
    fi
    if [ -n "${PACMAN_PACKAGES:-}" ]; then
      'C:\msys64\usr\bin\bash.exe' -lc "pacman -Sy --noconfirm && pacman -S --noconfirm ${PACMAN_PACKAGES}"
      echo '##vso[task.prependpath]C:\msys64\usr\bin'
      echo '##vso[task.prependpath]C:\msys64\opt\bin'
    fi
    if [ -n "${PIP_PACKAGES:-}" ]; then
      pip install ${PIP_PACKAGES}
    fi
    if [ -n "${SETUP_COMMANDS:-}" ]; then
      $(SETUP_COMMANDS)
    fi
    if [ -x '/usr/lib/x86_64-linux-gnu/wine/wineserver' ]; then
      echo '##vso[task.prependpath]/usr/lib/x86_64-linux-gnu/wine'
    fi
  displayName: 'Setup'
- bash: |
    set -xue
    export CMAKE_BUILD_PARALLEL_LEVEL="$(${NPROC_COMMAND:-nproc})"
    echo "${CMAKE_BUILD_PARALLEL_LEVEL}"
    cmake_args=(-G"${CMAKE_GENERATOR:-Ninja}")
    if [ -n "${TOOLCHAIN_FILE:-}" ]; then
        cmake_args+=(-DCMAKE_TOOLCHAIN_FILE="${TOOLCHAIN_FILE}")
    fi
    if [ -n "${C_COMPILER:-}" ]; then
        cmake_args+=(-DCMAKE_C_COMPILER="${C_COMPILER}")
    fi
    if [ -n "${CXX_COMPILER:-}" ]; then
        cmake_args+=(-DCMAKE_CXX_COMPILER="${CXX_COMPILER}")
    fi
    if [ -n "${COMPILER_FLAGS:-}" ]; then
        cmake_args+=(-DCMAKE_C_FLAGS="${COMPILER_FLAGS}" -DCMAKE_CXX_FLAGS="${COMPILER_FLAGS}")
    fi
    if [ -z "${SOURCE_DIR:-}" ]; then
        cmake_args+=(-DBUILD_CRUNCH=ON -DBUILD_EXAMPLES=ON -DBUILD_SHARED_LIBS=ON)
    fi
    cmake -S"${SOURCE_DIR:-.}" -Bbuild "${cmake_args[@]}"
    cmake --build build --config Release
  displayName: 'Build'
- bash: |
    set -xue
    EXECUTABLES="${EXECUTABLES:-crunch example1 example2 example3}"
    for exe_file in ${EXECUTABLES}; do
      file "build/${exe_file}${CRUNCH_EXE_EXTENSION:-}"
    done
    if [ -n "${RUNTIME_FILES:-}" ]; then
        cp -av ${RUNTIME_FILES} build/
    fi
    if "${RUN_TESTS:-true}"; then
      test/test.py
    fi
  displayName: 'Test'
